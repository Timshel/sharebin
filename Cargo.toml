[package]
name = "sharebin"
version = "2.0.8"
authors = ["Timshel"]
edition = "2021"
license = "BSD-3-Clause"
description = "Simple, performant, configurable, entirely self-contained Pastebin and URL shortener."
readme = "README.md"
homepage = "https://github.com/timshel/sharebin"
repository = "https://github.com/timshel/sharebin"
keywords = ["pastebin", "filesharing", "sharebin", "actix", "selfhosted"]
categories = ["pastebins"]

[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-web = { version = "4.11.0", default-features = false, features = ["compat","compress-brotli", "compress-gzip", "cookies", "http2", "macros", "unicode"] }
actix-web-httpauth = "0.8.2"
askama = "0.14.0"
bytesize = { version = "2.0.1", features = ["serde"] }
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive", "env"] }
dotenvy = { version = "0.15.7", default-features = false }
env_logger = "0.11.8"
futures = "0.3.31"
harsh = "0.2.2"
html-escape = "0.2.13"
lazy_static = "1.5.0"
linkify = "0.10.0"
log = "0.4.27"
magic-crypt = "4.0.1"
mime_guess = "2.0.5"
once_cell = "1.21.3"
qrcode-generator = "5.0.0"
rand = "0.9.1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "macos-system-configuration", "json", "blocking"] }
rusqlite = { version = "0.36", features = ["bundled"], optional = true }
rust-embed = "8.7.2"

# The rustls-rustcrypto version must support the rustls version and the
# rustls version must match the one expected by reqwest;
rustls = { version = "0.23", default-features = false, features = ["custom-provider"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }

sanitize-filename = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
syntect = { version = "5.2.0", default-features = false }
webpki-roots = { version = "1.0", optional = true }

[dependencies.openssl]
version = "0.10.73"
features = ["vendored"]
optional = true

[features]
default = ["__default-tls", "__zstd", "__syntect-fast", "dep:rusqlite"]
no-c-deps = ["__rustcrypto-tls", "__syntect-rust"]

__default-tls = ["reqwest/default-tls", "dep:openssl"]
__rustcrypto-tls = ["reqwest/rustls-tls-manual-roots-no-provider", "dep:rustls", "dep:rustls-rustcrypto", "webpki-roots"]
__syntect-fast = ["syntect/default-onig"]
__syntect-rust = ["syntect/default-fancy"]
__zstd = ["actix-web/compress-zstd"]

[profile.release]
lto = true
strip = true
